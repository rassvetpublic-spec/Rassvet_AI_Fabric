[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rassvet-ai-fabric"
version = "0.1.0"
description = "Независимое локальное ядро задач и MCP-шлюз только для чтения, ориентированные на Windows"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
security = ["PyJWT[crypto]>=2.10,<3"]
license = {text = "MIT"}

[project.scripts]
rai = "rai_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
