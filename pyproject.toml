[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rassvet-ai-fabric"
version = "0.1.0"
description = "Independent Windows-first task engine and read-only MCP gateway for AI development"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
rai = "rai_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
