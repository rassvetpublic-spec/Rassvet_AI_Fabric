name: AG Supervisor Tests
on:
  push:
    branches: [AG_pather]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
