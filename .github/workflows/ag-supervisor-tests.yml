# Экономный Windows-only workflow. Обычный push в AG_pather не запускает CI.
# Для явного контрольного запуска создайте ветку/тег ag-ci-win-*.
name: Проверка AG Supervisor на Windows

"on":
  push:
    branches:
      - 'ag-ci-win-*'
    tags:
      - 'ag-ci-win-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag-supervisor-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  unit-windows:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прогнать тесты AG Supervisor на Windows
        shell: pwsh
        run: python -m unittest discover -s tests -v
