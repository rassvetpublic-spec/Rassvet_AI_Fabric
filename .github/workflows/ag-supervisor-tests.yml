name: AG Supervisor Tests
on:
  push:
    branches: [AG_pather]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Windows Credential Manager using synthetic data only
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
