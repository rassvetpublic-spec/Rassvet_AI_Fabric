# Политика: только стандартные GitHub-hosted Windows runners для ПУБЛИЧНОГО репозитория.
# Изменения исходников/тестов запускают один Windows job. Чекпойнты и документация не запускают CI.
# Если репозиторий станет приватным, job пропускается во избежание тарифицируемых минут.
name: Проверка AG Supervisor на Windows

"on":
  push:
    branches:
      - AG_pather
      - 'ag-ci-win-*'
    tags:
      - 'ag-ci-win-*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'scripts/run-tests.ps1'
      - '.github/workflows/ag-supervisor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag-supervisor-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  unit-windows:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прогнать тесты AG Supervisor на Windows
        shell: pwsh
        run: python -m unittest discover -s tests -v
