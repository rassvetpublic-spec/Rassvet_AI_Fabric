name: Проверка Windows без облачных моделей

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-readonly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Получить исходники без сохранения учётных данных
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Установить выбранный Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Предварительная проверка Windows (без моделей)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/windows-preflight.ps1 -RequireWindows
      - name: Локальные модульные тесты
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/run-tests.ps1
      - name: Проверить жизненный цикл задачи на mock
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/demo.ps1
      - name: Очередь и отдельный процесс Codex-mock (без моделей)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/demo-codex-mock.ps1
