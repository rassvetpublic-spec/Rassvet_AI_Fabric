# Ограничение расхода CI: только Windows, без Linux/macOS и матрицы на каждый push.
name: Проверка Windows (экономный режим)

"on":
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-readonly.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-readonly.yml'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Версия Python для контрольной проверки'
        type: choice
        required: true
        default: '3.11'
        options:
          - '3.11'
          - '3.13'

permissions:
  contents: read

concurrency:
  group: windows-readonly-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows / Python ${{ inputs.python_version || '3.11' }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Получить исходники без сохранения учётных данных
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Установить выбранный Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
      - name: Установить зависимости проверки подписи токенов
        shell: pwsh
        run: |
          python -m pip install -e ".[security]"
      - name: Предварительная проверка Windows (без моделей)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/windows-preflight.ps1 -RequireWindows
      - name: Локальные модульные тесты
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/run-tests.ps1
      - name: Проверить жизненный цикл задачи на mock
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/demo.ps1
      - name: Очередь и отдельный процесс Codex-mock (без моделей)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          ./scripts/demo-codex-mock.ps1
